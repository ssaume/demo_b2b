async function api(action,payload={}){
 if(gasUrl){transport ||= new PortalTransport.GasBridge(gasUrl);return transport.call({action,token:session?.token,payload});}
 if(action==='login'){const p=Supply.profile(payload.username);if((payload.username!=='demo123'&&!p)||payload.password!=='123456789')throw new Error('帳號或密碼錯誤');return {token:'DEMO-'+uid(),user:Supply.publicUser({username:payload.username,role:p?'operator':'buyer',company:p?p.name:'示範企業股份有限公司'})};}
 if(!session?.token?.startsWith('DEMO-'))throw new Error('登入已失效，請重新登入');
 if(action==='logout')return true;
 const user=session.user,db=demoDb();if(user.role==='operator'&&!Supply.profile(user.username))throw new Error('舊供應帳號已停用，請使用新的供應帳號');

 if(action==='resources'){if(user.role!=='operator')throw new Error('此介面需要供應端權限');return Supply.utilization(db.orders,user,{startDate:today(),horizonDays:payload.horizonDays||14});}
 if(action==='checkout'){
   if(user.role!=='buyer')throw new Error('請以採購端帳號下單');
   const key=user.username+':'+payload.requestId;const hash=JSON.stringify({cart:payload.cart,form:payload.form});if(db.requests[key]){const prev=db.requests[key];if(prev.hash!==hash)throw new Error('此下單識別碼已有不同內容，請先確認先前結果，再重新整理購物車');return db.orders.filter(o=>prev.ids.includes(o.id));}
   const orders=Domain.makeOrders(payload.cart,payload.form,Domain.products,user.username,uid().replace(/-/g,''),new Date().toISOString());db.orders.push(...orders);db.requests[key]={ids:orders.map(o=>o.id),hash};write(dbKey,db);return orders;
 }
 if(action==='transition'){
   const o=db.orders.find(x=>x.id===payload.orderId&&Supply.canAccess(user,x));if(!o)throw new Error('訂單不存在');if(o.revision!==payload.revision)throw new Error('訂單已由其他人更新，請重新整理後再操作');Domain.transition(o,payload.itemId,payload.target,payload.input,user.username,user.role,new Date().toISOString());write(dbKey,db);return o;
 }
 throw new Error('不支援的操作');
}

 return heading('資源利用率','RESOURCE CAPACITY','檢視整體資源負荷，或只看自己負責產品使用的資源。',`<button class="btn" data-action="supply-plan">${icon('tree')}供應計畫模擬</button><button class="btn" data-action="refresh">${icon('refresh')}同步負荷</button>`)+`<div class="notice">${icon('info')}以尚未完成的需求換算規劃負荷；資源工時與能力為模擬參數。全體視角只呈現彙總負荷，不顯示其他供應組的需求明細。</div><section class="panel"><div class="toolbar resource-toolbar"><div class="tabs"><button class="tab ${state.resourceScope==='mine'?'active':''}" data-action="resource-scope" data-id="mine">與我相關</button><button class="tab ${state.resourceScope==='all'?'active':''}" data-action="resource-scope" data-id="all">所有資源</button></div><label>資源類型 <select id="resource-kind">${['all',...new Set(summary.resources.map(r=>r.kind))].map(k=>`<option value="${esc(k)}" ${state.resourceKind===k?'selected':''}>${k==='all'?'全部類型':esc(k)}</option>`).join('')}</select></label><label>規劃期間 <select id="resource-days">${[7,14,28].map(d=>`<option value="${d}" ${summary.horizonDays===d?'selected':''}>未來 ${d} 天</option>`).join('')}</select></label></div><div class="resource-summary"><div><span>資源數</span><strong>${rows.length}</strong></div><div><span>整體利用率</span><strong>${capacity?(hours/capacity*100).toFixed(1):0}%</strong></div><div><span>超過產能</span><strong>${rows.filter(r=>r.utilization>100).length}</strong></div><div><span>工作日</span><strong>${summary.workingDays}</strong></div></div><div class="panel-header"><h2>${state.resourceScope==='mine'?'我的供應資源':'全體資源彙總'}</h2><span>${summary.startDate} ～ ${summary.endDate}</span></div>${rows.map(r=>resourceBar(r)).join('')}${rows.length?'':'<div class="empty">沒有符合條件的資源</div>'}</section><p class="source-note">利用率＝規劃負荷工時 ÷ 可用工時。容量以週一至週五計算，未扣國定假日。負荷含需求交期落在期間內的未完成需求與逾期積壓，不含期間外的未來需求。</p>`;
}

function render(){if(!state.user)return login();$('#app').innerHTML=layout(({orders:ordersView,catalog:catalogView,detail:detailView,cart:cartView,plan:planView,resources:resourcesView}[state.view]||ordersView)());
 const search=$('#order-search');if(search)search.oninput=e=>{const pos=e.target.selectionStart;state.search=e.target.value;state.page=1;render();const n=$('#order-search');n.focus();n.setSelectionRange(pos,pos);};
 const productSearch=$('#product-search');if(productSearch)productSearch.oninput=e=>{const pos=e.target.selectionStart;state.productSearch=e.target.value;render();const n=$('#product-search');n.focus();n.setSelectionRange(pos,pos);};
 const scenario=$('#plan-scenario');if(scenario)scenario.onsubmit=e=>{e.preventDefault();const next=Object.fromEntries(new FormData(e.target));try{const {o,i}=planSelection();Supply.simulate(o,i,next,state.supply);state.planScenario=next;render();toast('供應情境已重新計算');}catch(err){$('#plan-error').textContent=err.message;}};
 const checkout=$('#checkout-form');if(checkout){if(state.checkoutForm)Object.entries(state.checkoutForm).forEach(([k,v])=>{const el=checkout.elements[k];if(el){if(el.type==='checkbox')el.checked=!!v;else el.value=v;}});checkout.oninput=()=>{state.checkoutForm=Object.fromEntries(new FormData(checkout));};checkout.onsubmit=submitCheckout;}
}
function showModal(title,body,onSubmit){modalPreviousFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="關閉">${icon('x')}</button></header><div class="modal-body">${body}</div></section></div>`;
 const form=$('form',$('#modal-root'));if(form&&onSubmit)form.onsubmit=async e=>{e.preventDefault();const button=$('button[type=submit]',form);button.disabled=true;const error=$('.form-error',form);if(error)error.textContent='';try{await onSubmit(Object.fromEntries(new FormData(form)));}catch(err){if(error)error.textContent=err.message;else toast(err.message);}finally{if(button.isConnected)button.disabled=false;}};
 setTimeout(()=>$('input,select,textarea,button',$('.modal-body'))?.focus(),0);
}
function closeModal(){if(busy)return;$('#modal-root').innerHTML='';modalPreviousFocus?.focus();}
function modalActions(label){return `<div class="form-error" role="alert"></div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn primary">${label}</button></div>`;}
function productModal(id){const p=state.catalog.find(p=>p.id===id);if(!p)return;showModal(esc(p.name),`<div class="product-modal-art">${productArt(p)}</div><p class="muted" style="line-height:1.8">${esc(p.description)} · ${esc(p.tag)}</p><div class="item-data" style="margin:20px 0">${datum('示範料號',p.sku)}${datum('產品類型',Domain.typeName(p.type))}${datum('未稅示範單價',money(p.price))}${datum('最小訂購量',p.moq+' 件')}${datum('示範交期',p.leadDays+' 天')}</div><a href="${esc(p.source)}" target="_blank" rel="noopener">查看官方產品分類 ${icon('external')}</a><p class="source-note">此版為系列層級示範配置，尚未導入完整規格選型；圖形為示意，非正式產品外觀。</p><div class="modal-footer"><button class="btn" data-action="close-modal">關閉</button><button class="btn primary" data-action="add" data-id="${esc(p.id)}" ${state.user.role!=='buyer'?'disabled':''}>加入購物車</button></div>`);}
function transitionModal(itemId,stop=false){const o=state.orders.find(x=>x.id===state.orderId),i=o.items.find(x=>x.id===itemId),n=stop?5:i.status+1;
 let fields='';if(stop)fields=`<div class="notice">${icon('info')}中止後保留歷史紀錄，不能直接恢復。已部分出貨的明細需另行協調。</div><label class="field">中止原因<textarea name="note" required maxlength="500" placeholder="說明異動原因"></textarea></label>`;
 else if(n===1)fields=`<div class="notice">${icon('info')}請先核對客戶 PO、價格、需求日期與供應可行性，再確認備料。</div><label class="field">備料 / 預留單號<input name="materialRef" required maxlength="80" placeholder="MR-2026-001"></label><label class="field">承諾交期<input type="date" name="committedDate" required value="${esc(o.needDate)}"></label><label class="check"><input type="checkbox" name="kitReady" required>已確認交易條件及物料齊套</label>`;
 else if(n===2)fields=`<label class="field">生產工單號<input name="workOrder" required maxlength="80" placeholder="WO-2026-001"></label><label class="field">生產開始日期<input type="date" name="productionStart" required value="${today()}"></label>`;
 else if(n===3)fields=`<div class="notice">${icon('info')}此版採全數完工入庫。可在入庫後分批出貨。</div><label class="field">完工數量<input type="number" name="completedQty" min="${i.qty}" max="${i.qty}" required value="${i.qty}"></label><div class="form-grid"><label class="field">入庫倉別<input name="warehouse" required maxlength="80" placeholder="成品倉"></label><label class="field">庫存批號<input name="lot" required maxlength="80" placeholder="LOT-2026-001"></label></div><label class="check"><input type="checkbox" name="qualityReleased" required>已完成品質檢驗並放行</label>`;
 else fields=`<div class="notice">${icon('info')}尚未出貨 ${i.qty-i.shippedQty} 件。部分出貨維持「已入庫」，全數出貨才轉為「已出貨」。</div><label class="field">本次出貨數量<input name="shipQty" type="number" min="1" max="${i.qty-i.shippedQty}" required value="${i.qty-i.shippedQty}"></label><label class="field">交貨單號<input name="delivery" required maxlength="80" placeholder="DN-2026-001"></label><label class="field">物流商<input name="carrier" required maxlength="80" placeholder="物流商名稱"></label><label class="field">追蹤資訊 / 提單號<input name="tracking" required maxlength="100" placeholder="物流追蹤號碼"></label>`;
 if(!stop)fields+=`<label class="field">操作備註<textarea name="note" maxlength="500" placeholder="補充說明（選填）"></textarea></label>`;
 showModal(stop?(supplierMode()?'中止需求明細':'中止訂單明細'):n===4?'安排出貨':`更新為${Domain.stages[n]}`,`<p class="small muted" style="margin-bottom:20px">${esc(i.name)} · ${esc(i.id)}</p><form>${fields}${modalActions(stop?'確認中止':'確認更新')}</form>`,async data=>{
   const input={...data,kitReady:!!data.kitReady,qualityReleased:!!data.qualityReleased};const target=!stop&&n===4&&Number(data.shipQty)+i.shippedQty<i.qty?3:n;
   busy=true;try{const updated=await api('transition',{orderId:o.id,itemId:i.id,target,input,revision:o.revision});state.orders=state.orders.map(x=>x.id===updated.id?updated:x);if(supplierMode())try{state.supply=await api('resources',{horizonDays:state.resourceDays});}catch{state.supply=null;}busy=false;closeModal();render();toast('明細狀態已更新');}finally{busy=false;}
 });
}
function settings(){showModal('連線與示範設定',`<div class="notice">${icon('info')}設定企業平台資料連線，儲存後重新登入。</div><form><label class="field">GAS 網頁應用程式網址<input name="url" type="url" value="${esc(gasUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></label><p class="source-note">GAS 允許來源請填：<b>${esc(location.origin)}</b><br>變更連線會登出並重新載入。</p>${modalActions('儲存連線設定')}</form>${gasUrl?`<div class="settings-actions"><button class="btn" data-action="test-connection">測試連線</button><button class="btn" data-action="connection-popup">以新視窗連線</button></div><div id="connection-result" class="small" role="status"></div>`:''}${state.user?`<div class="settings-actions"><button class="btn" data-action="switch-role">${icon('user')}登出並切換為${state.user.role==='buyer'?'供應端':'採購端'}</button>${!gasUrl?`<button class="btn danger" data-action="reset-demo">重設本機示範訂單</button>`:''}</div>`:''}<p class="source-note"></p>`,async data=>{const value=data.url.trim();if(value&&!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(value))throw new Error('請使用 GAS 正式部署的 /exec 網址');if(session)try{await api('logout');}catch{}localStorage.removeItem(sessionKey);write('demo-b2b-url',value);location.reload();});}
async function submitCheckout(e){e.preventDefault();if(busy)return;const f=e.target,button=$('button[type=submit]',f);button.disabled=true;$('#checkout-error').textContent='';state.checkoutForm=Object.fromEntries(new FormData(f));state.checkoutKey ||= uid();write(cartKey()+':checkout',{key:state.checkoutKey,form:state.checkoutForm});busy=true;
 try{const created=await api('checkout',{cart:state.cart,form:state.checkoutForm,requestId:state.checkoutKey});state.orders=state.orders.filter(o=>!created.some(n=>n.id===o.id)).concat(created);state.cart=[];saveCart();state.view='orders';state.filter='0';state.search='';state.page=1;render();showModal('採購需求已送出',`<div class="success-box">${icon('check')}　已依產品類型建立 <b>${created.length}</b> 筆訂單<br>全部從「審核中」開始，各明細獨立追蹤。</div>${created.map(o=>`<div class="split-preview"><div><b>${esc(Domain.typeName(o.type))}</b><p class="small mono muted" style="margin-top:6px">${esc(o.id)}</p></div><button class="btn sm" data-action="detail" data-id="${esc(o.id)}">查看</button></div>`).join('')}<div class="modal-footer"><button class="btn primary" data-action="close-modal">回到訂單總覽</button></div>`);
 }catch(err){if($('#checkout-error'))$('#checkout-error').textContent=err.message;else toast(err.message);}finally{busy=false;if(button.isConnected)button.disabled=false;}
}
async function refresh(silent=false){if(busy)return;const data=await api('bootstrap');if(supplierMode()&&state.resourceDays!==14)data.supply=await api('resources',{horizonDays:state.resourceDays});const changed=JSON.stringify(state.orders)!==JSON.stringify(data.orders)||JSON.stringify(state.catalog)!==JSON.stringify(data.catalog)||JSON.stringify(state.supply)!==JSON.stringify(data.supply);state.orders=data.orders;state.catalog=data.catalog;state.supply=data.supply;if(!silent||changed){if(!$('#modal-root').innerHTML&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render();if(!silent)toast(supplierMode()?'需求與資源已同步':'訂單已同步');else if(changed)toast('供應端進度已更新');}}
async function logout(next='demo123'){if(session)try{await api('logout');}catch{}session=null;localStorage.removeItem(sessionKey);state.user=null;state.view='orders';state.filter='all';state.search='';state.supply=null;state.planOrderId=null;state.planItemId=null;state.planScenario={};state.resourceScope='mine';state.resourceKind='all';state.resourceDays=14;state.menu=false;$('#modal-root').innerHTML='';login(next);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const a=b.dataset.action,id=b.dataset.id;
 try{
 if(a==='settings')return settings();if(a==='test-connection'){const result=$('#connection-result');if(result)result.textContent='檢測中…';const info=await PortalTransport.healthCheck(gasUrl);const message=!info.originAllowed?'來源未允許：請將 '+location.origin+' 加入 ALLOWED_ORIGINS':!info.databaseConfigured?'資料庫尚未初始化，請執行 setup':'部署 '+info.version+' 可存取，來源與資料庫設定正常';if(result)result.textContent=message;else toast(message);return;}if(a==='connection-popup'){transport ||= new PortalTransport.GasBridge(gasUrl);toast('正在建立新視窗連線…');await transport.connect('popup');toast('已連線，請保留連線視窗並重新登入');return;}if(a==='close-modal')return closeModal();if(a==='logout')return logout();if(a==='switch-role')return logout(state.user.role==='buyer'?'supplier01':'demo123');
 if(a==='reset-demo')return showModal('重設示範資料',`<p class="muted" style="line-height:1.9">這會清除本機示範訂單，重新建立初始範例。已連線的 GAS 資料不受影響。</p><form>${modalActions('確認重設')}</form>`,async()=>{localStorage.removeItem(dbKey);state.orders=demoDb().orders;closeModal();await refresh();});
 if(a==='menu'){state.menu=!state.menu;render();return;}
 if(['supply-plan','plan-demand','plan-view','resources','resource-scope','reset-plan'].includes(a)&&!supplierMode())throw new Error('此介面需要供應端權限');
 if(a==='supply-plan'||a==='plan-demand'){state.view='plan';if(id){state.planOrderId=id;state.planItemId=null;state.planScenario={};}state.menu=false;closeModal();render();return;}
 if(a==='plan-view'){state.planView=id==='network'?'network':'documents';render();return;}
 if(a==='reset-plan'){state.planScenario={};render();return;}
 if(a==='resources'){state.view='resources';state.menu=false;closeModal();render();return;}
 if(a==='resource-scope'){state.resourceScope=id==='all'?'all':'mine';render();return;}
 if(a==='orders'){state.view='orders';state.menu=false;closeModal();render();}
 if(a==='catalog'||a==='category'||a==='type'){state.view='catalog';state.menu=false;state.productSearch='';state.category=a==='catalog'?'all':a==='category'?id:b.dataset.category;state.type=a==='type'?id:'all';closeModal();render();}
 if(a==='cart'&&supplierMode())throw new Error('請以採購端帳號下單');
 if(a==='cart'){state.view='cart';state.menu=false;closeModal();render();}
 if(a==='filter'){state.filter=id;state.page=1;render();}
 if(a==='clear-filter'){state.filter='all';state.search='';state.page=1;render();}
 if(a==='detail'){state.orderId=id;state.view='detail';closeModal();render();}
 if(a==='prev'||a==='next'){state.page+=a==='prev'?-1:1;render();}
 if(a==='refresh'){busy=true;b.disabled=true;try{const data=await api('bootstrap');state.orders=data.orders;state.catalog=data.catalog;state.supply=supplierMode()&&state.resourceDays!==14?await api('resources',{horizonDays:state.resourceDays}):data.supply;render();toast(supplierMode()?'需求與資源已同步':'訂單已同步');}finally{busy=false;if(b.isConnected)b.disabled=false;}}
 if(a==='product')productModal(id);
 if(a==='add'){if(state.user.role!=='buyer')throw new Error('請以採購端帳號下單');const p=state.catalog.find(p=>p.id===id),c=state.cart.find(c=>c.productId===id);if(!p||p.active===false)throw new Error('產品已下架');if(c){if(c.qty+p.moq>100000)throw new Error('數量超過上限');c.qty+=p.moq;}else state.cart.push({productId:id,qty:p.moq});saveCart();render();toast(p.name+' 已加入購物車');}
 if(a==='remove'){state.cart=state.cart.filter(c=>c.productId!==id);saveCart();render();}
 if(a==='advance'||a==='stop')transitionModal(id,a==='stop');
 }catch(err){toast(err.message);}
});
document.addEventListener('change',async e=>{
 if(['plan-order','plan-item','resource-kind','resource-days'].includes(e.target.id)){
  try{if(!supplierMode())throw new Error('此介面需要供應端權限');if(e.target.id==='plan-order'){state.planOrderId=e.target.value;state.planItemId=null;state.planScenario={};}if(e.target.id==='plan-item'){state.planItemId=e.target.value;state.planScenario={};}if(e.target.id==='resource-kind')state.resourceKind=e.target.value;if(e.target.id==='resource-days'){const summary=await api('resources',{horizonDays:Number(e.target.value)});state.supply=summary;state.resourceDays=summary.horizonDays;}render();}catch(err){toast(err.message);}return;
 }
 const id=e.target.dataset.qty;if(!id)return;const p=state.catalog.find(p=>p.id===id),c=state.cart.find(c=>c.productId===id),n=Number(e.target.value);if(!Number.isSafeInteger(n)||n<p.moq||n>100000||n%p.moq!==0){e.target.value=c.qty;toast('數量須為 '+p.moq+' 的倍數，且不超過 100000');return;}c.qty=n;saveCart();render();});
document.addEventListener('keydown',e=>{if(!$('#modal-root').innerHTML)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=Array.from($('#modal-root').querySelectorAll('button:not(:disabled),a,input,select,textarea')).filter(x=>x.offsetParent!==null),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
async function start(){if(session){$('#app').innerHTML='<main style="min-height:100vh;display:grid;place-items:center" aria-busy="true"><div style="text-align:center"><div class="spinner" style="margin:0 auto 18px"></div><p class="muted">正在同步企業訂單…</p></div></main>';try{await load();}catch(err){session=null;localStorage.removeItem(sessionKey);login();$('#login-error').textContent=err.message;}}else login();}
setInterval(()=>{if(state.user&&document.visibilityState==='visible'&&!busy&&!$('#modal-root').innerHTML)refresh(true).catch(e=>toast(e.message));},Math.max(15,PORTAL_CONFIG.refreshSeconds||30)*1000);
start();
})();
</script></body></html>
