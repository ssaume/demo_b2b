 return `<section class="panel network-panel"><div class="panel-header"><h2>產品供應網路</h2><span>紅色＝剩餘要徑 · 箭頭＝前置關係</span></div><div class="network-graph-scroll"><svg class="network-svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(i.name)} BOM Routing 供應網路"><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8a9caa"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#d54e4e"/></marker></defs>${columns.map((c,x)=>`<rect x="${x*colWidth}" y="0" width="${colWidth}" height="${h}" fill="${x%2?'#edf5fc':'#f7fafc'}"/><text x="${20+x*colWidth}" y="30" class="graph-title">${x===0?'材料供應':x===max?'客戶交付':'製程／物流 '+x}</text>`).join('')}${edges}${nodes}</svg></div><div class="network-table"><table><thead><tr><th>節點／單據</th><th>父階料號／前置</th><th>資源階層</th><th>完成量</th><th>剩餘作業工時</th><th>ES／EF／浮時（h）</th><th>實績</th></tr></thead><tbody>${plan.nodes.map(n=>`<tr class="${n.critical?'critical-row':''}"><td>${esc(n.name)}<div class="secondary mono">${esc(n.docNo)}</div></td><td>${esc(n.parentPart||i.sku)}<div class="secondary">${esc(n.upstream.join('、')||'無前置')}</div></td><td>${esc(n.resourceParent)}<div class="secondary">${esc(n.resourceName)}</div></td><td>${n.completedQty} / ${n.requiredQty}<div class="secondary">${n.inferred?'階段推估':'節點實績'}</div></td><td>${n.laborHours.toFixed(2)}</td><td>${n.es.toFixed(2)} / ${n.ef.toFixed(2)} / ${n.floatHours.toFixed(2)}</td><td>${supplierMode()&&i.status<4?`<button class="btn sm" data-action="node-progress" data-id="${esc(n.id)}">回報</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="source-note">BOM ${esc(plan.bomRevision)} · Routing ${esc(plan.routingRevision)}；箭頭代表可並行與須匯流的關係。工時、材料與資源基準為示範主檔。</p></section>`;
}

 return heading('供應計畫模擬','SUPPLY PLANNING LAB','同一筆需求，從單據與供應網路檢視剩餘生命週期。',`<button class="btn" data-action="orders">${icon('back')}供應需求</button><button class="btn" data-action="resources">${icon('factory')}資源利用率</button>`)+`<div class="notice">${icon('info')}情境試算不改寫需求。網路中的「回報」會保存節點實績並更新剩餘工時。</div>`+controls+`<div class="work-metrics"><div><span>本產品總體作業工時</span><strong>${plan.totalLaborHours} h</strong><small>剩餘 ${plan.remainingLaborHours} h</small></div><div><span>本產品要徑作業工時</span><strong>${plan.criticalLaborHours} h</strong><small>剩餘 ${plan.remainingCriticalLaborHours} h</small></div><div><span>要徑歷時（含等待）</span><strong>${plan.criticalLeadHours} h</strong><small>剩餘 ${plan.remainingCriticalHours} h</small></div></div><div class="view-tabs"><button class="btn ${state.planView==='documents'?'primary':''}" data-action="plan-view" data-id="documents">${icon('orders')}單據視角</button><button class="btn ${state.planView==='network'?'primary':''}" data-action="plan-view" data-id="network">${icon('tree')}供應網路</button></div><div class="plan-layout"><div>${state.planView==='documents'?documents:network}<section class="panel scenario-resources"><div class="panel-header"><h2>情境資源利用率</h2><span>${state.supply?.horizonDays||14} 天期間</span></div>${plan.resources.map(r=>resourceBar({...r,related:true},true)).join('')}</section></div>${scenario}</div>`;

function resourcesView(){

 const rows=summary.resources.filter(r=>(state.resourceScope==='all'||r.related)&&(state.resourceKind==='all'||r.kind===state.resourceKind)),hours=rows.filter(r=>r.unit==='小時').reduce((n,r)=>n+r.hours,0),capacity=rows.filter(r=>r.unit==='小時').reduce((n,r)=>n+r.capacityHours,0);

 const scenario=$('#plan-scenario');if(scenario)scenario.onsubmit=e=>{e.preventDefault();const next=Object.fromEntries(new FormData(e.target));try{const {o,i}=planSelection();Supply.simulate(o,i,next,state.supply);state.planScenario=next;render();toast('供應情境已重新計算');}catch(err){$('#plan-error').textContent=err.message;}};

function showModal(title,body,onSubmit){modalPreviousFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="關閉">${icon('x')}</button></header><div class="modal-body">${body}</div></section></div>`;
 const form=$('form',$('#modal-root'));if(form&&onSubmit)form.onsubmit=async e=>{e.preventDefault();const button=$('button[type=submit]',form);button.disabled=true;const error=$('.form-error',form);if(error)error.textContent='';try{await onSubmit(Object.fromEntries(new FormData(form)));}catch(err){if(error)error.textContent=err.message;else toast(err.message);}finally{if(button.isConnected)button.disabled=false;}};
 setTimeout(()=>$('input,select,textarea,button',$('.modal-body'))?.focus(),0);
}

function transitionModal(itemId,stop=false){const o=state.orders.find(x=>x.id===state.orderId),i=o.items.find(x=>x.id===itemId),n=stop?5:i.status+1;
 let fields='';if(stop)fields=`<div class="notice">${icon('info')}中止後保留歷史紀錄，不能直接恢復。已部分出貨的明細需另行協調。</div><label class="field">中止原因<textarea name="note" required maxlength="500" placeholder="說明異動原因"></textarea></label>`;
 else if(n===1)fields=`<div class="notice">${icon('info')}請先核對客戶 PO、價格、需求日期與供應可行性，再確認備料。</div><label class="field">備料 / 預留單號<input name="materialRef" required maxlength="80" value="${esc(i.documentRefs?.material||'')}" placeholder="備料識別或外部參考"></label><label class="field">承諾交期<input type="date" name="committedDate" required value="${esc(o.needDate)}"></label><label class="check"><input type="checkbox" name="kitReady" required>已確認交易條件及物料齊套</label>`;
 else if(n===2)fields=`<label class="field">生產工單號<input name="workOrder" required maxlength="80" value="${esc(i.network?.nodes.find(n=>n.docType==='WO')?.docNo||'')}" placeholder="工單識別或外部參考"></label><label class="field">生產開始日期<input type="date" name="productionStart" required value="${today()}"></label>`;
 else if(n===3)fields=`<div class="notice">${icon('info')}此版採全數完工入庫。可在入庫後分批出貨。</div><label class="field">完工數量<input type="number" name="completedQty" min="${i.qty}" max="${i.qty}" required value="${i.qty}"></label><div class="form-grid"><label class="field">入庫倉別<input name="warehouse" required maxlength="80" placeholder="成品倉"></label><label class="field">庫存批號<input name="lot" required maxlength="80" placeholder="LOT-2026-001"></label></div><label class="check"><input type="checkbox" name="qualityReleased" required>已完成品質檢驗並放行</label>`;
 else fields=`<div class="notice">${icon('info')}尚未出貨 ${i.qty-i.shippedQty} 件。部分出貨維持「已入庫」，全數出貨才轉為「已出貨」。</div><label class="field">本次出貨數量<input name="shipQty" type="number" min="1" max="${i.qty-i.shippedQty}" required value="${i.qty-i.shippedQty}"></label><label class="field">交貨單號<input name="delivery" required maxlength="80" value="${esc(i.network?.nodes.find(n=>n.docType==='GI')?.docNo||'')}" placeholder="出庫識別或外部交貨參考"></label><label class="field">物流商<input name="carrier" required maxlength="80" placeholder="物流商名稱"></label><label class="field">追蹤資訊 / 提單號<input name="tracking" required maxlength="100" placeholder="物流追蹤號碼"></label>`;
 if(!stop)fields+=`<label class="field">操作備註<textarea name="note" maxlength="500" placeholder="補充說明（選填）"></textarea></label>`;
 showModal(stop?(supplierMode()?'中止需求明細':'中止訂單明細'):n===4?'安排出貨':`更新為${Domain.stages[n]}`,`<p class="small muted" style="margin-bottom:20px">${esc(i.name)} · ${esc(i.id)}</p><form>${fields}${modalActions(stop?'確認中止':'確認更新')}</form>`,async data=>{
   const input={...data,kitReady:!!data.kitReady,qualityReleased:!!data.qualityReleased};const target=!stop&&n===4&&Number(data.shipQty)+i.shippedQty<i.qty?3:n;
   busy=true;try{const updated=await api('transition',{orderId:o.id,itemId:i.id,target,input,revision:o.revision});state.orders=state.orders.map(x=>x.id===updated.id?updated:x);if(supplierMode())try{state.supply=await api('resources',{horizonDays:state.resourceDays});}catch{state.supply=null;}busy=false;closeModal();render();toast('明細狀態已更新');}finally{busy=false;}
 });
}
function settings(){showModal('連線與示範設定',`<div class="notice">${icon('info')}設定企業平台資料連線，儲存後重新登入。</div><form><label class="field">GAS 網頁應用程式網址<input name="url" type="url" value="${esc(gasUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></label><p class="source-note">GAS 允許來源請填：<b>${esc(location.origin)}</b><br>變更連線會登出並重新載入。</p>${modalActions('儲存連線設定')}</form><p class="source-note">使用來源：${esc(connection.source)}${connection.migrated?' · 舊連線設定已改用本版部署預設':''}<br>部署預設：${esc(PORTAL_CONFIG.gasUrl)}<br>一般模式失敗、無痕正常時，也請檢查 Google 多帳號登入及第三方 Cookie。</p><button class="btn" data-action="reset-connection">重設連線與登入</button>${gasUrl?`<div class="settings-actions"><button class="btn" data-action="test-connection">測試連線</button><button class="btn" data-action="connection-popup">以新視窗連線</button></div><div id="connection-result" class="small" role="status"></div>`:''}${state.user?`<div class="settings-actions"><button class="btn" data-action="switch-role">${icon('user')}登出並切換為${state.user.role==='buyer'?'供應端':'採購端'}</button>${state.user.isSupplyAdmin?`<button class="btn" data-action="demo-data">清除／帶入 Demo 資料</button>`:''}</div>`:''}<p class="source-note"></p>`,async data=>{const value=data.url.trim();if(value&&!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(value))throw new Error('請使用 GAS 正式部署的 /exec 網址');if(session)try{await api('logout');}catch{}localStorage.removeItem(sessionKey);write(connection.key,{url:value,version:PORTAL_CONFIG.version});location.reload();});}
async function submitCheckout(e){e.preventDefault();if(busy)return;const f=e.target,button=$('button[type=submit]',f);button.disabled=true;$('#checkout-error').textContent='';state.checkoutForm=Object.fromEntries(new FormData(f));state.checkoutKey ||= uid();write(cartKey()+':checkout',{key:state.checkoutKey,form:state.checkoutForm});busy=true;
 try{const created=await api('checkout',{cart:state.cart,form:state.checkoutForm,requestId:state.checkoutKey});state.orders=state.orders.filter(o=>!created.some(n=>n.id===o.id)).concat(created);state.cart=[];saveCart();state.view='orders';state.filter='0';state.search='';state.page=1;render();showModal('採購需求已送出',`<div class="success-box">${icon('check')}　已依產品類型建立 <b>${created.length}</b> 筆訂單<br>全部從「審核中」開始，各明細獨立追蹤。</div>${created.map(o=>`<div class="split-preview"><div><b>${esc(Domain.typeName(o.type))}</b><p class="small mono muted" style="margin-top:6px">${esc(o.id)}</p></div><button class="btn sm" data-action="detail" data-id="${esc(o.id)}">查看</button></div>`).join('')}<div class="modal-footer"><button class="btn primary" data-action="close-modal">回到訂單總覽</button></div>`);
 }catch(err){if($('#checkout-error'))$('#checkout-error').textContent=err.message;else toast(err.message);}finally{busy=false;if(button.isConnected)button.disabled=false;}
}
async function refresh(silent=false){if(busy)return;const data=await api('bootstrap');if(supplierMode()&&state.resourceDays!==14)data.supply=await api('resources',{horizonDays:state.resourceDays});const changed=state.dataRevision!==(data.dataRevision||1)||JSON.stringify(state.suppliers)!==JSON.stringify(data.suppliers||[])||state.user?.isSupplyAdmin!==data.user?.isSupplyAdmin||JSON.stringify(state.orders)!==JSON.stringify(data.orders)||JSON.stringify(state.catalog)!==JSON.stringify(data.catalog)||JSON.stringify(state.supply)!==JSON.stringify(data.supply);state.user=data.user;state.suppliers=data.suppliers||[];state.mappingRevision=data.mappingRevision||1;if(state.suppliers.length)Supply.setProfiles(state.suppliers);applyDataRevision(data);state.orders=data.orders;state.catalog=data.catalog;state.supply=data.supply;await reloadResourceDocuments();if(!silent||changed){if(!$('#modal-root').innerHTML&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render();if(!silent)toast(supplierMode()?'需求與資源已同步':'訂單已同步');else if(changed)toast('供應端進度已更新');}}
async function logout(next='demo123'){if(session)try{await api('logout');}catch{}session=null;localStorage.removeItem(sessionKey);state.user=null;state.resourceDocuments={};state.dataRevision=null;state.view='orders';state.filter='all';state.search='';state.supply=null;state.planOrderId=null;state.planItemId=null;state.planScenario={};state.resourceScope='mine';state.resourceKind='all';state.resourceDays=14;state.menu=false;$('#modal-root').innerHTML='';login(next);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const a=b.dataset.action,id=b.dataset.id;
 try{
 if(a==='reset-connection'){transport?.destroy();localStorage.removeItem(connection.key);localStorage.removeItem(sessionKey);localStorage.removeItem('demo-b2b-url');localStorage.removeItem('delta-b2b-url');location.reload();return;}
 if(a==='buyer-network'){const o=state.orders.find(o=>o.id===id);if(!o)throw new Error('查無可存取的訂單');state.view='plan';state.planView='network';state.planOrderId=id;state.planItemId=null;render();return;}
 if(a==='suppliers'){if(!supplierMode())throw new Error('需要供應端權限');state.view='suppliers';state.menu=false;render();return;}
 if(a==='edit-supplier')return supplierModal(id);
 if(a==='delegate')return delegateModal(id);
 if(a==='node-progress')return nodeProgressModal(id);
 if(a==='demo-data')return demoDataModal();if(a==='dataset-review')return demoDataModal(id);
 if(a==='resource-documents'){if(!supplierMode())throw new Error('需要供應端權限');if(state.resourceDocuments[id])delete state.resourceDocuments[id];else state.resourceDocuments[id]=await api('resourceConsumption',{resourceId:id,horizonDays:state.resourceDays});render();return;}
 if(a==='resource-document'){const o=state.orders.find(o=>o.id===id);if(!supplierMode()||!o||!o.items.some(i=>i.id===b.dataset.item))throw new Error('查無可存取的需求');state.view='plan';state.planView='network';state.planOrderId=id;state.planItemId=b.dataset.item;render();return;}
 if(a==='settings')return settings();if(a==='test-connection'){const result=$('#connection-result');if(result)result.textContent='檢測中…';const info=await PortalTransport.healthCheck(gasUrl);const message=!info.originAllowed?'來源未允許：請將 '+location.origin+' 加入 ALLOWED_ORIGINS':(!info.databaseConfigured||info.databaseReady===false)?'資料庫尚未初始化，請執行 setup':'部署 '+info.version+' 可存取，來源與資料庫設定正常';if(result)result.textContent=message;else toast(message);return;}if(a==='connection-popup'){transport ||= new PortalTransport.GasBridge(gasUrl);toast('正在建立新視窗連線…');await transport.connect('popup');toast('已連線，請保留連線視窗並重新登入');return;}if(a==='close-modal')return closeModal();if(a==='logout')return logout();if(a==='switch-role')return logout(state.user.role==='buyer'?'supplier01':'demo123');
 if(a==='reset-demo')return demoDataModal('demo');
 if(a==='menu'){state.menu=!state.menu;render();return;}
 if(['supply-plan','plan-demand','resources','resource-scope'].includes(a)&&!supplierMode())throw new Error('此介面需要供應端權限');
 if(a==='supply-plan'||a==='plan-demand'){state.view='plan';if(id){state.planOrderId=id;state.planItemId=null;state.planScenario={};}state.menu=false;closeModal();render();return;}
 if(a==='plan-view'){state.planView=id==='network'?'network':'documents';render();return;}
 if(a==='reset-plan'){state.planScenario={};render();return;}
 if(a==='resources'){state.view='resources';state.menu=false;closeModal();render();return;}
 if(a==='resource-scope'){state.resourceScope=id==='all'?'all':'mine';render();return;}
 if(a==='orders'){state.view='orders';state.menu=false;closeModal();render();}
 if(a==='catalog'||a==='category'||a==='type'){state.view='catalog';state.menu=false;state.productSearch='';state.category=a==='catalog'?'all':a==='category'?id:b.dataset.category;state.type=a==='type'?id:'all';closeModal();render();}
 if(a==='cart'&&supplierMode())throw new Error('請以採購端帳號下單');
 if(a==='cart'){state.view='cart';state.menu=false;closeModal();render();}
 if(a==='filter'){state.filter=id;state.page=1;render();}
 if(a==='clear-filter'){state.filter='all';state.search='';state.page=1;render();}
 if(a==='detail'){state.orderId=id;state.view='detail';closeModal();render();}
 if(a==='prev'||a==='next'){state.page+=a==='prev'?-1:1;render();}
 if(a==='refresh'){busy=true;b.disabled=true;try{const data=await api('bootstrap');state.user=data.user;state.suppliers=data.suppliers||[];state.mappingRevision=data.mappingRevision||1;if(state.suppliers.length)Supply.setProfiles(state.suppliers);applyDataRevision(data);state.orders=data.orders;state.catalog=data.catalog;state.supply=supplierMode()&&state.resourceDays!==14?await api('resources',{horizonDays:state.resourceDays}):data.supply;await reloadResourceDocuments();render();toast(supplierMode()?'需求與資源已同步':'訂單已同步');}finally{busy=false;if(b.isConnected)b.disabled=false;}}
 if(a==='product')productModal(id);
 if(a==='add'){if(state.user.role!=='buyer')throw new Error('請以採購端帳號下單');const p=state.catalog.find(p=>p.id===id),c=state.cart.find(c=>c.productId===id);if(!p||p.active===false)throw new Error('產品已下架');if(c){if(c.qty+p.moq>100000)throw new Error('數量超過上限');c.qty+=p.moq;}else state.cart.push({productId:id,qty:p.moq});saveCart();render();toast(p.name+' 已加入購物車');}
 if(a==='remove'){state.cart=state.cart.filter(c=>c.productId!==id);saveCart();render();}
 if(a==='advance'||a==='stop')transitionModal(id,a==='stop');
 }catch(err){toast(err.message);}
});
document.addEventListener('change',async e=>{
 if(['plan-order','plan-item','resource-kind','resource-days'].includes(e.target.id)){
  try{if(!supplierMode()&&e.target.id.startsWith('resource-'))throw new Error('此介面需要供應端權限');if(e.target.id==='plan-order'){state.planOrderId=e.target.value;state.planItemId=null;state.planScenario={};}if(e.target.id==='plan-item'){state.planItemId=e.target.value;state.planScenario={};}if(e.target.id==='resource-kind')state.resourceKind=e.target.value;if(e.target.id==='resource-days'){const summary=await api('resources',{horizonDays:Number(e.target.value)});state.supply=summary;state.resourceDays=summary.horizonDays;await reloadResourceDocuments();}render();}catch(err){toast(err.message);}return;
 }
 const id=e.target.dataset.qty;if(!id)return;const p=state.catalog.find(p=>p.id===id),c=state.cart.find(c=>c.productId===id),n=Number(e.target.value);if(!Number.isSafeInteger(n)||n<p.moq||n>100000||n%p.moq!==0){e.target.value=c.qty;toast('數量須為 '+p.moq+' 的倍數，且不超過 100000');return;}c.qty=n;saveCart();render();});
document.addEventListener('keydown',e=>{if(!$('#modal-root').innerHTML)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=Array.from($('#modal-root').querySelectorAll('button:not(:disabled),a,input,select,textarea')).filter(x=>x.offsetParent!==null),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
async function start(){if(session){$('#app').innerHTML='<main style="min-height:100vh;display:grid;place-items:center" aria-busy="true"><div style="text-align:center"><div class="spinner" style="margin:0 auto 18px"></div><p class="muted">正在同步企業訂單…</p></div></main>';try{await load();}catch(err){session=null;localStorage.removeItem(sessionKey);login();$('#login-error').textContent=err.message;}}else login();}
let autoRefreshing=false;setInterval(async()=>{if(state.user&&document.visibilityState==='visible'&&!busy&&!autoRefreshing&&!$('#modal-root').innerHTML){autoRefreshing=true;try{await refresh(true);}catch(e){toast(e.message);}finally{autoRefreshing=false;}}},Math.max(60,PORTAL_CONFIG.refreshSeconds||60)*1000);
start();
})();
</script>
</body></html>
